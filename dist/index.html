<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Map of the places to see in Thessaloniki, pinned stop by stop over two days.">
  <title>Thessaloniki · Trip Map</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102a43'/%3E%3Cpath d='M32 12c-8 0-14 6-14 14 0 10 14 26 14 26s14-16 14-26c0-8-6-14-14-14z' fill='%23e9a34a'/%3E%3Ccircle cx='32' cy='26' r='5' fill='%23102a43'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --ink: #102a43;
      --cream: #fff9ed;
      --muted: #597182;
      --line: rgba(16, 42, 67, .14);
      --day1: #b9573a;
      --day2: #165b7d;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #map { position: fixed; inset: 0; }
    aside {
      position: fixed; z-index: 1000; top: 14px; left: 14px;
      width: 320px; max-height: calc(100% - 28px); overflow-y: auto;
      padding: 18px 16px 20px;
      border-radius: 18px;
      background: rgba(255, 249, 237, .93);
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 34px rgba(10, 36, 56, .22);
    }
    .head { display: flex; align-items: flex-start; gap: 10px; }
    .head > div { flex: 1; }
    #toggle {
      flex: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: var(--muted); font: inherit; font-size: .75rem; cursor: pointer;
    }
    aside.collapsed .sub, aside.collapsed #days { display: none; }
    h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.01em; }
    .sub { margin: 4px 0 18px; color: var(--muted); font-size: .9rem; }
    .day { margin-top: 18px; }
    .day h2 {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    }
    .day h2::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
    .day h2 button {
      margin-left: auto; flex: none; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
      background: transparent; color: var(--muted); font: inherit; font-size: .7rem; cursor: pointer;
    }
    ol { list-style: none; margin: 0; padding: 0; }
    li button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; border: 0; border-radius: 10px;
      background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    li button:hover, li button:focus-visible { background: rgba(16, 42, 67, .06); outline: none; }
    .num {
      flex: none; display: grid; place-items: center; width: 26px; height: 26px;
      border-radius: 50%; background: var(--c); color: #fff; font-size: .8rem; font-weight: 700;
    }
    .name { font-weight: 600; }
    .note { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }

    .pin {
      display: grid; place-items: center; width: 30px; height: 30px;
      border: 2px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      background: var(--c); box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
    }
    .pin span { transform: rotate(45deg); color: #fff; font: 700 11px/1 system-ui, sans-serif; }
    .pin.split { background: linear-gradient(45deg, var(--day1) 50%, var(--day2) 50%); }
    .pin.home { --c: var(--ink); width: 34px; height: 34px; }
    .pin.home span { font-size: 16px; }
    .hotel .num { --c: var(--ink); }
    .leaflet-popup-content { margin: 12px 14px; font: 14px/1.45 Inter, system-ui, sans-serif; }
    .leaflet-popup-content b { font-size: 15px; }
    .leaflet-popup-content a { color: var(--day2); }

    .leaflet-top.leaflet-left { left: 346px; }

    @media (max-width: 760px) {
      aside { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 45%; }
      .leaflet-top.leaflet-left { left: 0; }
      .leaflet-bottom.leaflet-right { bottom: auto; top: 0; }
    }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Map of Thessaloniki stops"></div>
  <aside id="panel">
    <div class="head">
      <div><h1>Thessaloniki</h1></div>
      <button id="toggle" type="button" aria-expanded="true">Hide</button>
    </div>
    <p class="sub">Every stop on the trip, pinned. Tap one to find it on the map.</p>
    <div id="days"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Coordinates from OpenStreetMap. Ano Poli is an area (pinned at its heart, by Vlatadon
    // Monastery); the Black Pearl is pinned at its usual mooring by the White Tower.
    const PLACES = {
      anoPoli:      { name: "Ano Poli", note: "Old Upper Town", ll: [40.64150, 22.95420] },
      walls:        { name: "Byzantine Walls", note: "Trigonion Tower viewpoint", ll: [40.64143, 22.95950] },
      aristotelous: { name: "Aristotelous Square", ll: [40.63234, 22.94090] },
      kapani:       { name: "Kapani Market", note: "Vlali market", ll: [40.63593, 22.94263] },
      modiano:      { name: "Modiano Market", ll: [40.63497, 22.94188] },
      tsimiski:     { name: "Tsimiski Street", note: "Shopping street", ll: [40.63320, 22.94420] },
      forum:        { name: "Roman Forum", ll: [40.63771, 22.94587] },
      dimitrios:    { name: "Agios Dimitrios", note: "Church of Saint Demetrius", ll: [40.63876, 22.94786] },
      galerius:     { name: "Arch of Galerius", note: "Kamara", ll: [40.63220, 22.95180] },
      rotunda:      { name: "Rotunda", ll: [40.63331, 22.95287] },
      blackPearl:   { name: "Black Pearl", note: "Pirate-ship harbour cruise", ll: [40.62690, 22.94690] },
      whiteTower:   { name: "White Tower", ll: [40.62633, 22.94838] },
    };

    const HOTEL = { name: "Hotel", note: "Ptolemeon 14, 546 30", ll: [40.63959, 22.93855] };

    const DAYS = [
      { title: "Day 1 · Upper Town to the markets", hex: "#b9573a",
        stops: ["anoPoli", "walls", "aristotelous", "kapani", "modiano", "tsimiski"] },
      { title: "Day 2 · Roman centre to the sea", hex: "#165b7d",
        stops: ["forum", "dimitrios", "galerius", "rotunda", "blackPearl", "whiteTower", "kapani"] },
    ];

    const map = L.map("map");
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    }).addTo(map);

    // Collect every visit per place, so a place visited on both days gets one split pin.
    const visits = {};
    DAYS.forEach((day, d) => day.stops.forEach((key, i) => {
      (visits[key] = visits[key] || []).push({ d, n: i + 1 });
    }));

    const markers = {};
    Object.entries(visits).forEach(([key, vs]) => {
      const p = PLACES[key];
      const split = new Set(vs.map(v => v.d)).size > 1;
      const icon = L.divIcon({
        className: "",
        html: `<div class="pin${split ? " split" : ""}" style="--c:${DAYS[vs[0].d].hex}"><span>${vs.map(v => v.n).join("·")}</span></div>`,
        iconSize: [30, 30], iconAnchor: [15, 34], popupAnchor: [0, -32],
      });
      const when = vs.map(v => `Day ${v.d + 1}, stop ${v.n}`).join(" &amp; ");
      const gmaps = `https://www.google.com/maps/search/?api=1&query=${p.ll.join(",")}`;
      markers[key] = L.marker(p.ll, { icon, title: p.name, riseOnHover: true })
        .bindPopup(`<b>${p.name}</b>${p.note ? `<br>${p.note}` : ""}<br><small>${when}</small><br><a href="${gmaps}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`)
        .addTo(map);
    });

    // Dashed line through each day's stops, in order.
    const dayLines = DAYS.map(day =>
      L.polyline(day.stops.map(k => PLACES[k].ll), { color: day.hex, weight: 3, opacity: .7, dashArray: "6 8" }).addTo(map));

    const hotelGmaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("Ptolemeon 14, 546 30 Thessaloniki")}`;
    const hotelMarker = L.marker(HOTEL.ll, {
      icon: L.divIcon({ className: "", html: '<div class="pin home"><span>⌂</span></div>',
                        iconSize: [34, 34], iconAnchor: [17, 38], popupAnchor: [0, -36] }),
      title: HOTEL.name, zIndexOffset: 1000,
    }).bindPopup(`<b>${HOTEL.name}</b><br>${HOTEL.note}<br><a href="${hotelGmaps}" target="_blank" rel="noopener">Open in Google Maps ↗</a>`).addTo(map);

    const panel = document.getElementById("panel");
    const narrow = () => window.matchMedia("(max-width: 760px)").matches;
    // Keep pins clear of the floating panel when framing the map.
    const pad = () => narrow() ? { paddingTopLeft: [30, 30], paddingBottomRight: [30, panel.offsetHeight + 30] }
                               : { paddingTopLeft: [panel.offsetWidth + 50, 40], paddingBottomRight: [40, 40] };
    map.fitBounds(L.latLngBounds([HOTEL.ll, ...Object.values(PLACES).map(p => p.ll)]), pad());

    const toggle = document.getElementById("toggle");
    toggle.onclick = () => {
      const collapsed = panel.classList.toggle("collapsed");
      toggle.textContent = collapsed ? "Show stops" : "Hide";
      toggle.setAttribute("aria-expanded", String(!collapsed));
    };

    // Stop list.
    const daysEl = document.getElementById("days");
    const hotelEl = document.createElement("ol");
    hotelEl.className = "hotel";
    hotelEl.innerHTML = `<li><button type="button"><span class="num">⌂</span><span class="name">${HOTEL.name}<span class="note">${HOTEL.note}</span></span></button></li>`;
    hotelEl.querySelector("button").onclick = () => { map.flyTo(HOTEL.ll, 17, { duration: .6 }); hotelMarker.openPopup(); };
    daysEl.appendChild(hotelEl);
    DAYS.forEach((day, d) => {
      const sec = document.createElement("section");
      sec.className = "day";
      sec.style.setProperty("--c", day.hex);
      sec.innerHTML = `<h2>${day.title}<button type="button">Show day</button></h2><ol></ol>`;
      sec.querySelector("h2 button").onclick = () => map.flyToBounds(dayLines[d].getBounds(), pad());
      const ol = sec.querySelector("ol");
      day.stops.forEach((key, i) => {
        const p = PLACES[key];
        const li = document.createElement("li");
        li.innerHTML = `<button type="button"><span class="num">${i + 1}</span><span class="name">${p.name}${p.note ? `<span class="note">${p.note}</span>` : ""}</span></button>`;
        li.firstChild.onclick = () => {
          map.flyTo(p.ll, 17, { duration: .6 });
          markers[key].openPopup();
        };
        ol.appendChild(li);
      });
      daysEl.appendChild(sec);
    });
  </script>
</body>
</html>
